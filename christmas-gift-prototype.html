<!DOCTYPE html>
<!-- Throwaway prototype: three Christmas gift-card placements on the real home page. -->
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Prototyp: julklapp från MammaMind</title>
  <style>
    body { margin: 0; }
    iframe { display: block; width: 100%; height: 100dvh; border: 0; }
    .switcher {
      position: fixed; z-index: 20; left: 50%; bottom: .75rem; transform: translateX(-50%);
      display: flex; align-items: center; gap: .75rem; width: max-content; max-width: calc(100vw - 1rem);
      padding: .5rem .75rem; border: 1px solid white; border-radius: 999px;
      background: #3a2f2b; color: white; box-shadow: 0 4px 24px #0004;
      font: 600 .8rem/1.2 sans-serif;
    }
    .switcher button {
      width: 2.25rem; height: 2.25rem; border: 0; border-radius: 50%;
      background: #f5f0e7; color: #3a2f2b; font-size: 1.25rem; cursor: pointer;
    }
    .switcher button:focus-visible { outline: 3px solid #f0b49c; outline-offset: 2px; }
  </style>
</head>
<body>
  <iframe src="/index.html" title="Startsidan med julprototyp"></iframe>
  <nav class="switcher" aria-label="Välj prototyp">
    <button type="button" id="previous" aria-label="Föregående variant">←</button>
    <span id="label" aria-live="polite"></span>
    <button type="button" id="next" aria-label="Nästa variant">→</button>
  </nav>
  <script>
    // The prototype is local-only; it must not become a public site feature.
    if (!['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
      document.body.textContent = 'Den här prototypen kan bara visas lokalt.';
      throw new Error('Prototype is local-only');
    }

    const frame = document.querySelector('iframe');
    const variants = [
      { key: 'A', name: 'Julremsa' },
      { key: 'B', name: 'Presentkort i fokus' },
      { key: 'C', name: 'Hälsning i hero' }
    ];
    let current = Math.max(0, variants.findIndex(v => v.key === new URLSearchParams(location.search).get('variant')));
    const contact = 'mailto:info@mammamind.se?subject=Presentkort%20fr%C3%A5n%20MammaMind';
    const designs = [
      `<aside class="gift-prototype gift-ribbon" aria-label="Julklappstips">
        <img class="gift-bow" src="/assets/images/christmas-gift-prototype-bow.png" alt="">
        <span>✦ &nbsp; JULKLAPPSTIPS &nbsp; ✦</span>
        <strong>Ge en mamma en stund för sig själv.</strong>
        <a href="${contact}">Fråga om presentkort →</a>
      </aside>`,
      `<aside class="gift-prototype gift-feature" aria-label="Julklappstips">
        <div class="gift-feature-inner">
          <div class="gift-card-art" aria-hidden="true"><span>MAMMAMIND</span><strong>En stund<br>för dig.</strong><span>✦ &nbsp; PRESENTKORT &nbsp; ✦</span></div>
          <div class="gift-feature-copy">
            <p class="gift-eyebrow">JULKLAPPSTIPS</p>
            <h2>Ge bort en stund för mamman</h2>
            <p>En julklapp med plats för rörelse, återhämtning och gemenskap. Upptäck MammaMinds presentkort.</p>
            <a href="${contact}">Fråga om presentkort →</a>
          </div>
        </div>
      </aside>`,
      `<aside class="gift-prototype gift-note" aria-label="Julklappstips">
        <span aria-hidden="true">✦</span>
        <div><p class="gift-eyebrow">EN JULKLAPP MED OMTANKE</p>
        <strong>En stund för en mamma du tycker om.</strong>
        <p>Ge bort ett presentkort från MammaMind.</p>
        <a href="${contact}">Fråga om presentkort →</a></div>
      </aside>`
    ];
    const styles = `
      .gift-prototype { box-sizing: border-box; }
      .gift-prototype a { color: inherit; font-weight: 600; text-underline-offset: .25em; }
      .gift-ribbon { --bow-x: max(45px, calc((100% - 1100px) / 4 + 12px)); --bow-w: 90px; position: relative; z-index: 5; background: #684139; color: #fffaf3; display: flex; justify-content: center; align-items: center; gap: 1.5rem; padding: 1rem 1.25rem 1rem 7rem; text-align: center; }
      .gift-ribbon::before { content: ''; position: absolute; top: 0; bottom: 0; left: calc(var(--bow-x) - var(--bow-w) / 12); width: calc(var(--bow-w) / 6); background: linear-gradient(90deg, #a9070c, #d8181d 45%, #b80c11); box-shadow: 0 0 6px #0005; }
      .gift-bow { position: absolute; z-index: 1; left: calc(var(--bow-x) - var(--bow-w) / 2); top: 50%; width: var(--bow-w); transform: translateY(-22%) rotate(10deg); border-radius: 0; filter: drop-shadow(0 3px 4px #0006); }
      .gift-ribbon span, .gift-eyebrow { font-size: .68rem; font-weight: 700; letter-spacing: .16em; }
      .gift-ribbon strong { font-family: Georgia, serif; font-size: 1.1rem; font-weight: 400; }
      .gift-ribbon a { font-size: .8rem; white-space: nowrap; }
      .gift-feature { background: #e7d8ce; padding: clamp(2rem, 5vw, 4rem) 1.375rem; }
      .gift-feature-inner { max-width: 800px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 6vw, 4rem); align-items: center; }
      .gift-card-art { min-height: 220px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; background: #765047; color: #fffaf3; box-shadow: 10px 10px 0 #c7a99a; }
      .gift-card-art span { font-size: .65rem; letter-spacing: .18em; }
      .gift-card-art strong { font: 400 clamp(2rem, 4vw, 3rem)/1.1 Georgia, serif; }
      .gift-feature-copy h2 { margin: .4rem 0 1rem; text-align: left !important; }
      .gift-feature-copy p { margin: 0 0 1rem; }
      .gift-note { display: flex; align-items: flex-start; gap: 1rem; max-width: 520px; padding: 1.2rem 1.5rem; border: 1px solid #c9a99a; background: #f9f2ec; text-align: left; }
      .gift-note > span { color: #a26d58; font-size: 1.5rem; }
      .gift-note p { margin: 0 0 .3rem; }
      .gift-note strong { font: 400 1.3rem Georgia, serif; }
      .gift-note a { font-size: .85rem; }
      @media (max-width: 650px) {
        .gift-ribbon { --bow-x: 1.75rem; --bow-w: 52px; display: grid; grid-template-columns: 1fr auto; justify-content: normal; gap: .3rem .5rem; padding: .6rem .9rem .6rem 3.75rem; text-align: left; line-height: 1.4; }
        .gift-ribbon span { font-size: .62rem; letter-spacing: .08em; white-space: nowrap; }
        .gift-ribbon strong { grid-column: 1 / -1; grid-row: 2; font-size: 1.02rem; }
        .gift-ribbon a { font-size: .76rem; white-space: nowrap; }
        .gift-feature-inner { grid-template-columns: 1fr; }
        .gift-card-art { min-height: 170px; }
      }
      @media (max-width: 360px) {
        .gift-ribbon { padding-left: 3.1rem; padding-right: .6rem; }
        .gift-ribbon span { letter-spacing: .04em; }
        .gift-ribbon a { font-size: .7rem; }
      }
    `;

    function render() {
      const doc = frame.contentDocument;
      if (!doc || !doc.querySelector('.hero')) return;
      doc.querySelector('.gift-prototype')?.remove();
      if (!doc.getElementById('gift-prototype-styles')) {
        const style = doc.createElement('style');
        style.id = 'gift-prototype-styles';
        style.textContent = styles;
        doc.head.append(style);
      }
      const hero = doc.querySelector('.hero');
      if (current === 0) hero.insertAdjacentHTML('beforebegin', designs[current]);
      if (current === 1) hero.insertAdjacentHTML('afterend', designs[current]);
      if (current === 2) doc.querySelector('.hero-text').insertAdjacentHTML('beforeend', designs[current]);
      document.querySelector('#label').textContent = `PROTOTYP · ${variants[current].key}: ${variants[current].name}`;
      const url = new URL(location.href);
      url.searchParams.set('variant', variants[current].key);
      history.replaceState(null, '', url);
    }

    function move(step) {
      current = (current + step + variants.length) % variants.length;
      render();
    }
    function keys(event) {
      if (event.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        move(event.key === 'ArrowLeft' ? -1 : 1);
      }
    }
    document.querySelector('#previous').addEventListener('click', () => move(-1));
    document.querySelector('#next').addEventListener('click', () => move(1));
    document.addEventListener('keydown', keys);
    frame.addEventListener('load', () => {
      render();
      frame.contentDocument.addEventListener('keydown', keys);
    });
  </script>
</body>
</html>
