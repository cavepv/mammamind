schema: spec-driven

context: |
  Stack: static HTML/CSS/JS on GitHub Pages (mammamind.se)
  Backend: Supabase (Postgres + Edge Functions, Deno)
  Payments: Stripe (hosted Checkout, webhooks)
  Email: Resend (sending from info@mammamind.se)
  Domain host: one.com
  Styling: vanilla CSS, design tokens in styles/general.css
  No build step, no framework, no npm. Plain files.
  Language: Swedish (UI text), English (code + comments)
  Conventional commits. Pre-commit review required (see rules).

rules:
  tasks:
    - Break tasks into independently verifiable steps
    - Every task must include a "Verify" criterion
  design:
    - Include data model tables for any DB changes
    - Include security considerations section
  pre-commit:
    - Before every commit, run caveman-review with claude-opus-4.6
    - Before every commit, run caveman-review with gpt-5.3-codex
    - Do not push until both reviews are addressed or explicitly dismissed
